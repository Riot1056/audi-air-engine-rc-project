<style>
:root{--bg:#091321;--panel:#142338;--line:#2d4560;--text:#eff5fb;--muted:#a4b7ca;--cyan:#39d3e2;--orange:#ffa54b;--green:#73dc9c;--red:#ff6868}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 15%,#1a3150 0,#091321 54%);font:16px/1.5 'Segoe UI',Arial,sans-serif;color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.player{width:min(1180px,100%);background:rgba(13,25,42,.92);border:1px solid #344a63;border-radius:20px;overflow:hidden;box-shadow:0 28px 80px #0008}.top{padding:18px 26px 0;color:var(--cyan);font-size:13px;font-weight:700;letter-spacing:.14em}.progress{height:5px;background:#23374e;margin-top:14px}.bar{height:100%;width:0;background:var(--cyan);transition:width .15s}.screen{padding:28px 34px 14px;min-height:450px}.tag{color:var(--orange);font-weight:700;letter-spacing:.12em;font-size:13px}.title{font-size:clamp(27px,4vw,44px);line-height:1.1;margin:6px 0 8px}.question{font-size:16px;color:var(--muted);margin-bottom:25px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.visual,.notes{background:linear-gradient(140deg,#172b42,#101e31);border:1px solid #2b415b;border-radius:17px;min-height:250px;padding:23px;position:relative;overflow:hidden}.visual{display:flex;flex-direction:column;justify-content:center;align-items:center}.diagram{width:100%;height:170px;display:flex;align-items:center;justify-content:center;gap:10px}.node{padding:14px 10px;border:2px solid var(--cyan);border-radius:13px;text-align:center;min-width:98px;background:#132942;font-size:13px;font-weight:700;position:relative}.node.orange{border-color:var(--orange)}.node.green{border-color:var(--green)}.arrow{color:var(--cyan);font-size:24px}.cyls{display:flex;gap:8px;align-items:end}.cyl{width:44px;height:110px;border:2px solid var(--cyan);border-radius:9px 9px 5px 5px;background:#263c56;position:relative}.cyl:before{content:'';position:absolute;left:5px;right:5px;height:19px;background:#99adc1;top:calc(28px + 13px*sin(var(--phase)));border-radius:3px;animation:stroke 1.4s ease-in-out infinite alternate}.cyl:nth-child(2n):before{animation-delay:-.7s}.cyl:after{content:'';position:absolute;width:5px;height:38px;background:var(--orange);left:18px;bottom:-36px;transform-origin:top;animation:rod 1.4s linear infinite alternate}@keyframes stroke{to{transform:translateY(19px)}}@keyframes rod{to{transform:rotate(18deg)}}.tank{width:90px;height:145px;border:3px solid var(--cyan);border-radius:32px;position:relative;background:#19324d}.tank:after{content:'RATED\A TANK';white-space:pre;position:absolute;inset:45px 0;text-align:center;font-weight:700;color:var(--cyan)}.pistonBox{width:142px;height:160px;border:4px solid var(--cyan);border-radius:12px;position:relative;background:#1c3550}.pistonBox:before{content:'';position:absolute;top:62px;left:10px;right:10px;height:25px;background:#a9bed1;animation:stroke 1.4s ease-in-out infinite alternate}.pistonBox:after{content:'';position:absolute;width:7px;height:67px;background:var(--orange);left:67px;top:85px;transform-origin:top;animation:rod 1.4s linear infinite alternate}.fly{width:62px;height:62px;border:6px solid var(--orange);border-radius:50%;animation:spin 2.5s linear infinite;position:relative}.fly:after{content:'';position:absolute;left:23px;top:-13px;width:6px;height:77px;background:var(--orange);transform:rotate(25deg)}@keyframes spin{to{transform:rotate(360deg)}}.bullets{list-style:none;padding:0;margin:5px 0}.bullets li{display:flex;gap:12px;margin:15px 0;font-size:17px}.bullets li:before{content:'●';color:var(--cyan);font-size:12px;margin-top:4px}.noteTitle{font-weight:700;color:var(--cyan);font-size:18px;margin:0 0 12px}.questionBox{padding:14px 16px;background:#0b1727;border:1px solid #324963;border-radius:12px;margin-top:18px;color:var(--orange);font-weight:650}.foot{display:flex;align-items:center;gap:14px;padding:18px 26px 23px;border-top:1px solid #2b4058}button{background:#203750;color:var(--text);border:1px solid #39536f;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}button:hover{border-color:var(--cyan)}button.play{background:var(--cyan);color:#071421;border:0;font-weight:800;min-width:100px}.time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}.small{font-size:13px;color:var(--muted);padding:0 26px 18px}.safety{color:var(--red);font-weight:700}.chapterlist{display:flex;gap:7px;overflow:auto;padding:0 26px 18px}.chapterlist button{white-space:nowrap;font-size:12px;padding:7px 10px}.chapterlist button.active{border-color:var(--orange);color:var(--orange)}@media(max-width:720px){body{padding:8px}.screen{padding:22px 17px}.grid{grid-template-columns:1fr}.visual,.notes{min-height:190px}.diagram{height:140px}.node{min-width:75px;font-size:11px;padding:10px 5px}.small{padding:0 17px 15px}.foot{padding:15px 17px}.chapterlist{padding-left:17px;padding-right:17px}}
</style></head><body><main class="player"><div class="top">PROJECT LESSON • AIR-POWERED RC CAR</div><div class="progress"><div class="bar" id="bar"></div></div><section class="screen"><div class="tag" id="tag"></div><h1 class="title" id="title"></h1><div class="question" id="subtitle"></div><div class="grid"><div class="visual"><div class="diagram" id="diagram"></div><div id="caption" style="text-align:center;color:var(--muted);max-width:520px"></div></div><div class="notes"><div class="noteTitle">Key points</div><ul class="bullets" id="bullets"></ul><div class="questionBox" id="question"></div></div></div></section><div class="chapterlist" id="chapterlist"></div><div class="foot"><button class="play" id="play">▶ Play</button><button id="back">◀ Chapter</button><button id="next">Chapter ▶</button><span class="time" id="time">00:00 / 00:00</span></div><div class="small">Voiceover is computer-generated. This lesson is a concept and planning guide, not a build-ready engine design. <span class="safety">Use teacher-approved, commercially rated pressure hardware only; never print a pressure vessel.</span></div><audio id="audio" preload="metadata" src="https://github.com/Riot1056/audi-air-engine-rc-project/releases/download/v1.0.0/Audi_Air_Engine_20min_Voiceover.wav"></audio></main>
<script>
const C=[{"title": "The project in one sentence", "tag": "START HERE", "visual": "concept", "bullets": ["Audi-inspired five-cylinder layout", "Compressed air replaces combustion", "First milestone: a safe single-cylinder demo"], "question": "What would count as a useful first proof?", "script": "Welcome. This lesson turns the idea into an engineering project you can actually investigate. The goal is an Audi Sport quattro S1 inspired, compressed-air powered RC car. The look and inline-five layout provide the theme. Compressed air provides the energy. The end goal is to design, build, and test a small vehicle, while keeping the project mostly printable on a standard desktop printer. Here is the first important distinction: the model you imported into Tinkercad is a visual concept. It is not a functioning pressure engine. It does not yet define the seals, bearings, crank geometry, valves, pressure supply, tolerances, or test evidence needed for a working machine. That is normal at the beginning. We will use the model to communicate the idea, then replace guesses with measurements. The project succeeds first by proving one safe, repeatable cylinder. The five-cylinder engine and car come later. A fast car is a stretch goal; a convincing engineering process is the first goal.", "start": 0.0, "end": 59.083174603174605}, {"title": "Turn the wish list into requirements", "tag": "PROJECT TARGET", "visual": "targets", "bullets": ["Under 10 pounds", "At least 10 mph on smooth asphalt", "5–7 minutes full-power equivalent is a target"], "question": "Which requirement should be relaxed first if the data says no?", "script": "Your current targets are a total vehicle mass below ten pounds, a speed of at least ten miles per hour on smooth asphalt, and an outing around ten minutes, with perhaps five to seven minutes equivalent at full power. Speed matters more than long continuous runtime. Treat every number as a target, not a promise. Write a requirement table with four columns: requirement, how you will measure it, current status, and next evidence. For example, weigh the complete vehicle on a scale. Measure speed over a known distance or with a sensor. Define runtime precisely: does the car need to move for ten minutes, or is five minutes of full-throttle driving acceptable with pauses? Those are different tests. Also specify whether the car must carry its own air tank, whether the tank is replaceable, and whether a tether is allowed during the first engine demo. The first design review should decide these definitions. Without them, a design can appear successful while missing what you actually meant.", "start": 60.083174603174605, "end": 117.26154195011338}, {"title": "What the Audi reference gives you", "tag": "THEME AND MECHANICS", "visual": "five", "bullets": ["Inline-five visual identity", "Reference firing order: 1–2–4–5–3", "Do not copy combustion hardware blindly"], "question": "Are you building a display engine first or a powered prototype?", "script": "The Audi S1 reference gives the project a recognizable five-cylinder silhouette and a reason to care about the details. An inline-five has five cylinders in one row. Audi five-cylinder engines are commonly associated with firing order one, two, four, five, three. Use that order as a nostalgic reference for labels or a later timing concept, but do not assume that copying the firing order creates a working compressed-air engine. A combustion engine uses fuel, ignition, heat, compression, and a specific valve cycle. Your pneumatic engine has no combustion. It needs air admission and exhaust events that turn piston motion into useful shaft rotation. The cylinder spacing, crank angles, port locations, valve timing, and supply pressure must be designed for the pneumatic cycle. You can preserve the overall five-cylinder appearance while choosing a simpler mechanism underneath. Keep the original concept model as a visual reference, and create a separate functional design with clear, dimensioned parts.", "start": 118.26154195011338, "end": 175.85446712018143}, {"title": "Why compressed air is a tough power source", "tag": "FEASIBILITY CHECK", "visual": "energy", "bullets": ["Stored air is limited energy", "Expansion, leaks, and valves cost performance", "Measure before scaling"], "question": "Can one cylinder deliver enough useful shaft power for your chosen chassis?", "script": "Here is the hard challenge. Compressed air is convenient to demonstrate, but it stores relatively little usable energy for its mass and volume compared with many other ways of powering an RC car. The tank, regulator, valves, tubes, and brackets all add mass. As air expands, it can cool. Pressure falls as the tank empties. Small passages and valves restrict flow. Leaks, seal friction, and exhaust losses reduce useful work. A motor that spins freely on a stand may still stall when asked to accelerate a car. This is why runtime is the central unknown, not a small finishing detail. We should not claim that a certain tank will give five or seven minutes without knowing its approved capacity, pressure rating, flow path, motor consumption, and car load. We will measure air consumption on a single-cylinder rig, estimate the energy budget, and only then decide whether the full RC target is reachable. If it is not, you can still succeed by building a short-run demonstrator or a static cutaway.", "start": 176.85446712018143, "end": 235.37727891156464}, {"title": "How a piston can turn a crank", "tag": "BASIC MECHANISM", "visual": "piston", "bullets": ["Air force moves the piston", "Rod pushes an offset crank pin", "Crank rotation drives the output shaft"], "question": "Where will the piston seal, and how will that friction be measured?", "script": "Imagine one cylinder standing vertically. A piston slides inside it. A connecting rod attaches the piston to a crank pin that is offset from the crankshaft centerline. If air pressure pushes on the piston, the rod pushes on the crank pin. Because the pin is offset, the force creates torque and turns the shaft. As the shaft rotates, the crank pin pulls the piston back for the next part of the cycle. This familiar slider-crank geometry is a useful starting point, but it has dead-center positions where the crank can have little leverage. A single cylinder can stop at an awkward angle unless a flywheel, another cylinder, or a different arrangement carries it through. Five cylinders can help smooth torque, but only if their crank phases and air timing are designed together. You will need low-friction bearings, carefully aligned rods, a shaft that does not bend, and seals that do not drag too much. The first prototype should expose these parts for observation and adjustment.", "start": 236.37727891156464, "end": 291.625306122449}, {"title": "Choose a pneumatic cycle", "tag": "DESIGN CHOICE", "visual": "cycle", "bullets": ["Air admission creates the power stroke", "Exhaust must leave without trapping pressure", "Pick a simple valve strategy for prototype one"], "question": "Which valve layout can you explain, build, and test safely?", "script": "The next design choice is how air gets in and out. A pneumatic piston needs an admission event that pushes it in a useful direction, and an exhaust path that lets spent air escape. If the exhaust stays blocked, the piston may fight trapped air. If the valve opens at the wrong crank angle, air may be wasted or the shaft may fail to turn. A combustion engine's intake, compression, power, and exhaust sequence is not automatically the best pneumatic cycle. Possible approaches include a spool valve, a rotary distributor, or ports uncovered by piston motion. Each has different sealing, timing, friction, and manufacturing challenges. At this stage, choose one cylinder and one simple valve concept. Draw the crank angle, piston position, and valve state around one complete revolution. Mark where air enters and where it vents. Do not begin with a complicated five-cylinder rotary valve just because the final engine has five cylinders. The goal is a mechanism you can understand, inspect, and improve from test results.", "start": 292.625306122449, "end": 351.4827664399093}, {"title": "The five-cylinder timing problem", "tag": "TIMING AND CRANKS", "visual": "five", "bullets": ["Five cylinders share a shaft", "Crank phasing and air timing must match", "Audi firing order is an aesthetic reference"], "question": "What evidence would prove the five cylinders are phased correctly?", "script": "Scaling from one cylinder to five adds a coordination problem. Each piston connects to the same crankshaft, but each crank pin may have a different phase. The valve system must send air to the right cylinder at the right time, and give the previous cylinder a path to exhaust. If every cylinder receives air together, their forces may cancel or create a harsh load. If the timing is inconsistent, the shaft may stop or run poorly. Audi's firing order can inspire the sequence of cylinder labels, but it is not enough to set crank phase or pneumatic port timing. Start by making a crank-angle diagram. Put the five cylinders in order one through five. For every angle, indicate which cylinder is receiving air, which is exhausting, and the direction each piston moves. Then calculate or prototype the crank-pin positions. The initial test should use a hand-turned shaft and low-risk motion checks with no stored high-pressure energy. Once the geometry is understood, a qualified adult can review the rated air apparatus and test plan.", "start": 352.4827664399093, "end": 411.42603174603175}, {"title": "Engine parts: printable and purchased", "tag": "COMPONENT CHECKLIST", "visual": "parts-engine", "bullets": ["Print: covers, block, fixtures, guards", "Buy/machine: shaft, pins, bearings, fasteners", "Seals are a design item, not an afterthought"], "question": "Which parts must be replaceable after a failed test?", "script": "For the engine itself, make a bill of materials with part name, quantity, material, source, and whether it is pressure-bearing. Likely printed parts include a display block, cylinder spacers, valve housing prototype, non-pressure covers, sensor mounts, and test fixtures. Functional cylinders may need a liner or smooth bore; raw printed surfaces can leak or wear, so do not assume the print itself will seal well. Use suitable pistons and seals selected with teacher guidance. A metal crankshaft, crank pins, connecting rods or rod ends, bearings, shaft collars, and fasteners are good candidates for purchased or machined hardware. You may need a flywheel or another way to reduce dead-center stalling. Keep covers removable so you can inspect wear. Design the components as separate parts rather than one decorative mesh. Make room for tolerances, bearing alignment, seal replacement, and fastener access. Your current imported Tinkercad mesh is useful to show the appearance, but it should be rebuilt as an assembly with actual joints and dimensions before it is treated as functional CAD.", "start": 412.42603174603175, "end": 475.32299319727895}, {"title": "Air supply, controls, and safety", "tag": "NON-NEGOTIABLE", "visual": "safety", "bullets": ["Use a commercial rated reservoir and rated fittings", "Never print the pressure vessel", "Teacher review before any pressurized test"], "question": "Who will approve the vessel, relief arrangement, and test enclosure?", "script": "The pressure source is the part that deserves the most respect. Use only a commercially manufactured reservoir intended and rated for the service, with compatible regulator, gauge, shutoff, tubing, fittings, and relief protection selected and installed by a qualified adult. Never 3D print the tank. Do not put unverified printed parts in the pressure boundary. A printed engine block may be a visual shell while approved hardware contains and controls the air. Your teacher must review the entire setup, including the tank rating, connections, relief path, mounting, inspection, test area, and operating procedure before any pressurized test. Keep people away from the possible direction of failed parts. Do not pressure-test homemade vessels. Compressed-air systems can cause catastrophic injury when vessels rupture or fittings fail; OSHA describes rupture hazards and the need for safe design and operation. This lesson does not specify an operating pressure or a tank size because those values must come from the selected rated equipment and reviewed engineering plan. Safety approval comes before performance testing.", "start": 476.32299319727895, "end": 541.0443537414966}, {"title": "Air tank and runtime: build an energy budget", "tag": "RUNTIME REALITY", "visual": "energy", "bullets": ["Tank capacity alone does not equal runtime", "Need measured air use under load", "Calculate after the first engine test"], "question": "Will your test log capture tank state, throttle, speed, and elapsed time?", "script": "To estimate runtime, record the reservoir's approved capacity and operating limits from its markings and documentation, then measure how quickly the engine uses air under a defined load. Do not compare tank capacity alone to a runtime promise. The regulator may maintain pressure for part of the run, then output pressure can fall. The valve may consume air even when the car is not moving. Flow changes with valve opening, engine speed, leakage, and load. A good test log records starting and ending tank conditions using the equipment's own approved indicators, elapsed time, valve command or throttle, engine speed, wheel speed, and whether the car is on a stand or moving. Repeat each test so you can tell a real pattern from a lucky run. Your full-power equivalent might mean adding separate full-throttle intervals while allowing cool-down or refill between them. Define it mathematically before claiming the target. Until you have those measurements, the 5–7 minute figure remains a hypothesis. That is not a failure; it is the main research question of the project.", "start": 542.0443537414966, "end": 601.8112471655329}, {"title": "Chassis, gearing, and wheel speed", "tag": "GETTING TO 10 MPH", "visual": "gearing", "bullets": ["Engine RPM must match wheel RPM through gearing", "Higher reduction adds wheel torque but lowers speed", "Measure real loaded speed"], "question": "What tire diameter and gear ratio can your first chassis actually support?", "script": "The engine's shaft does not connect directly to the road. You need a gear reduction, likely a differential, axles, wheel hubs, tires, and a chassis that keeps everything aligned. A higher reduction ratio multiplies wheel torque but lowers wheel speed. A lower ratio gives more speed but can leave the motor unable to accelerate the car. Here is a simple illustrative calculation. Ten miles per hour is about 4.47 meters per second. If a hypothetical tire is 100 millimeters in diameter, its circumference is about 0.314 meters. At ten miles per hour, that wheel would turn around 855 revolutions per minute, before allowing for tire deformation or slip. Your actual tire diameter may be different. Once you measure the engine's useful loaded RPM, compare it with the wheel RPM target to choose a preliminary gear ratio. Then test acceleration and speed on a controlled smooth surface. A tachometer reading with no load is not enough. Keep the tank low and secure on the chassis, with enough clearance to avoid hitting the road.", "start": 602.8112471655329, "end": 664.9981859410431}, {"title": "Mass budget and packaging", "tag": "UNDER 10 POUNDS", "visual": "targets", "bullets": ["Budget mass by subsystem", "Tank and hardware may dominate", "Keep a margin for fasteners and wiring"], "question": "What is your current estimated total mass, with sources for every estimate?", "script": "The ten-pound limit is a system-level constraint. Make a mass budget before designing every bracket. List the air reservoir, regulator, valves, engine block, crankshaft, drivetrain, battery, receiver, servo, chassis, wheels, body, and fasteners. Use real component weights from product data or a scale wherever possible. Add a margin for hardware you forgot. The air supply could be a large fraction of the total mass, so designing a beautiful engine first and discovering the tank does not fit would waste time. Package the heaviest items low and secure them so the car stays stable. Leave access to the shutoff, gauge, fittings, and refill connection. Think about center of gravity, wheelbase, tire grip, and braking, not only whether the parts fit in a CAD assembly. If your first mass estimate exceeds ten pounds, identify which requirement can change: perhaps a smaller chassis, shorter runtime, slower speed, or a tethered demonstration. A clear tradeoff is stronger engineering than hiding the weight.", "start": 665.9981859410431, "end": 725.0512018140589}, {"title": "CAD and 3D printing plan", "tag": "DESIGN FOR YOUR PRINTER", "visual": "cad", "bullets": ["Start with a dimensioned single-cylinder assembly", "Print fit coupons before whole parts", "Avoid thin walls and inaccessible fasteners"], "question": "What is the exact Bambu printer model and build volume at school?", "script": "You have access to Bambu Lab printers, but you do not yet know the exact model or material rules. Ask your teacher for the printer model, build volume, approved filaments, nozzle, and school safety policy. For CAD, start with a single-cylinder assembly: cylinder or liner, piston, rod, crank, two bearings, and a hand-turning crank handle. Use dimensions you can measure or source from purchased hardware. Print small fit coupons for the piston and seal before printing a large block. Make bearing seats and fastener holes accessible. Split parts so they fit the printer and can be replaced. Orient layers so ordinary loads do not peel the part apart, but do not rely on printed structure to contain compressed air. The slicer preview is not proof of strength. Label each revision, save the CAD file and print settings, and record what changed after every test. A clean, simple, editable assembly will teach you more than a highly detailed engine-shaped mesh.", "start": 726.0512018140589, "end": 783.5847619047619}, {"title": "Prototype one cylinder first", "tag": "LOW-RISK EXPERIMENT", "visual": "test", "bullets": ["Hand-check alignment and friction", "Teacher-approved rated air system only", "Measure before adding complexity"], "question": "What is the safest test fixture your instructor will approve?", "script": "Prototype one cylinder before five. First, assemble the mechanism without pressure. Turn the crank by hand through many revolutions. Check for binding, rubbing, rod interference, loose screws, and places where the piston can fall out. Measure the force needed to turn it if you have a simple spring scale or torque method. Next, ask your teacher to review the rated air hardware and make a written test procedure. Use a guarded stand, secure the reservoir and engine, keep hands and faces away from moving parts, and have a shutoff within the adult operator's reach. Start only with a conservative configuration chosen by the qualified adult and equipment documentation. Record the valve arrangement, approved supply setup, starting conditions, engine speed, whether it starts from different crank positions, leaks, temperature observations, and failures. Stop if anything loosens, cracks, leaks unexpectedly, or behaves differently from the plan. A prototype that does not run gives valuable data if you can explain what failed and what you will change.", "start": 784.5847619047619, "end": 847.3268934240363}, {"title": "Build up in stages", "tag": "TEST LADDER", "visual": "stages", "bullets": ["Single cylinder → timed pair → five-cylinder mechanism", "Then transmission → chassis → speed test", "Change one variable at a time"], "question": "What result must be met before you move to the next stage?", "script": "A sensible test ladder prevents you from debugging the whole car at once. Stage one is a hand-turned single-cylinder mechanism. Stage two is a single-cylinder air test on a teacher-approved, rated setup. Stage three adds a flywheel or controlled valve timing if needed. Stage four can add a second cylinder to see whether phase changes improve starting and smoothness. Only after timing is understood should you attempt the five-cylinder assembly. Then add the transmission on a stand. Then mount it on a chassis without the tank, and check rolling resistance, steering, and braking. Finally integrate the approved air supply and test in a controlled area. At each stage, write a pass condition before you begin. For example, a pass may mean several repeatable starts from different crank positions, no visible loosening, and a measured output speed. Change one thing at a time when possible. If you simultaneously change the seal, valve timing, and gear ratio, you will not know which change helped. The goal is learning that compounds.", "start": 848.3268934240363, "end": 908.6243083900226}, {"title": "RC controls and stopping", "tag": "VEHICLE CONTROL", "visual": "controls", "bullets": ["Receiver and servo are only part of the system", "Need reliable air command and shutoff", "Plan steering, braking, and fail-safe behavior"], "question": "How will the car stop safely if radio signal or valve control is lost?", "script": "A powered RC car needs more than a receiver and steering servo. The radio system must command steering and the air valve, and the air path needs a predictable shutoff. Decide what the valve does if radio signal is lost, power is disconnected, a control linkage jams, or the tank pressure drops. The safe behavior should be designed and reviewed with your teacher. Add mechanical braking or another stopping method appropriate to the chassis; do not assume that closing the air valve instantly stops the wheels. The car can coast, and a heavy tank changes how it handles. Test steering, braking, and fail-safe behavior at walking speed before a speed run. Keep the first tests in a closed, empty area with adult supervision, eye protection as directed by school policy, and an emergency stop plan. Do not test around people, roads, or fragile property. A ten-mile-per-hour model can still cause injury or damage. Control and stopping are part of the power system design, not accessories to add at the end.", "start": 909.6243083900226, "end": 968.1323809523809}, {"title": "Make every test communicate progress", "tag": "EVIDENCE FOR YOUR UNCLE", "visual": "report", "bullets": ["Show the question, setup, and result", "Include failures and what changed", "End with the next decision"], "question": "What is the one chart or measurement your uncle should see first?", "script": "To communicate progress with your uncle, make a short update after each meaningful milestone. Start with the question you were testing. Show a photo or diagram of the setup. State what changed since the previous version. Share the measurements in a small table: date, configuration, mass, engine speed, wheel speed, air use or tank condition, runtime, and observations. Include failures. A cracked printed bracket or a valve that misses timing is useful if you explain how you found it and what you will change. End with the next decision you need help thinking through. Avoid claiming that a prototype met ten miles per hour unless you measured it under repeatable conditions. Keep the Tinkercad concept image labeled as visual only. Later, add a dimensioned CAD assembly and photos of the one-cylinder test rig. This turns a big ambition into a record of evidence. Your uncle can see not just what you hope to build, but how your engineering judgment is improving.", "start": 969.1323809523809, "end": 1025.0955555555556}, {"title": "Decision gate: is the full car feasible?", "tag": "HONEST REVIEW", "visual": "gate", "bullets": ["Compare measured air use, speed, mass, and runtime", "Revise one target if the system misses", "A strong demo can still be a win"], "question": "What result would make you pivot while keeping the project valuable?", "script": "At the end of the single-cylinder and drivetrain tests, hold a feasibility review. Compare actual measured air use and shaft performance with the energy available from the selected rated reservoir. Compare real component masses with the ten-pound budget. Compare loaded engine RPM and gearing with the wheel speed needed for ten miles per hour. Estimate how long the system can run using measured data, and repeat the test to see how consistent it is. If the vehicle misses a target, choose a deliberate pivot. You could reduce speed, shorten runtime, use a larger but still safely mounted rated reservoir if the school permits it, build a tethered air demonstration, or create a non-powered rolling display with an animated engine. The right choice depends on evidence, budget, schedule, and teacher approval. Do not quietly redefine success after the test. Write down the changed target and why. Engineering is not proving your first guess correct; it is learning what the system can do and making the next best decision.", "start": 1026.0955555555556, "end": 1082.368253968254}, {"title": "Your next three actions", "tag": "START THIS WEEK", "visual": "next", "bullets": ["Ask teacher for printer and pressure-system constraints", "Rebuild CAD as a single-cylinder mechanism", "Create a requirement and test log"], "question": "Who can review your first CAD sketch and test plan?", "script": "Here are your next three actions. First, ask your teacher for the exact Bambu printer model, build volume, approved print materials, and the school's rules for compressed air. Do not buy a pressure tank or design a pressure vessel before that conversation. Second, sketch one cylinder, piston, connecting rod, crank, and bearings. Label every dimension you know and circle every dimension that is still a guess. Third, create a requirement table and a test log. Put the under-ten-pound, ten-mile-per-hour, and five-to-seven-minute-equivalent goals in it as unproven targets. Define how you will weigh the car, measure speed, and measure runtime. Share the concept model and this lesson with your uncle, then ask for a review of the plan. The first milestone is not a five-cylinder car. It is a clear, safe, measurable single-cylinder concept that you can explain. When you have the printer model and the first sketch, bring them back. Then we can challenge the geometry, question the assumptions, and choose the next experiment together.", "start": 1083.368253968254, "end": 1145.030566893424}];
const $=x=>document.getElementById(x),a=$('audio');
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(i){let c=C[i];$('tag').textContent=c.tag;$('title').textContent=c.title;$('subtitle').textContent='Pause and consider: '+c.question;$('caption').textContent=c.bullets.join('   •   ');$('bullets').innerHTML=c.bullets.map(x=>'<li>'+x+'</li>').join('');$('question').textContent='Challenge question: '+c.question;let d='';switch(c.visual){case'concept':d='<div class="cyls">'+Array.from({length:5},()=>'<div class="cyl"></div>').join('')+'</div>';break;case'five':d='<div class="cyls">'+Array.from({length:5},(_,j)=>'<div class="cyl" style="height:'+(90+8*(j%3))+'px"></div>').join('')+'</div><div class="fly"></div>';break;case'piston':case'cycle':d='<div style="display:flex;align-items:center;gap:24px"><div class="pistonBox"></div><span class="arrow">➜</span><div class="fly"></div></div>';break;case'parts-engine':d='<div class="node">PISTON +<br>SEALS</div><span class="arrow">↔</span><div class="node orange">ROD +<br>CRANK</div><span class="arrow">↔</span><div class="node green">BEARINGS</div>';break;case'safety':d='<div class="tank"></div><div class="node orange">REGULATOR<br>+ GAUGE</div><span class="arrow">➜</span><div class="node">SHUTOFF<br>+ RATED LINE</div>';break;case'gearing':d='<div class="node">ENGINE<br>RPM</div><span class="arrow">➜</span><div class="fly"></div><span class="arrow">➜</span><div class="node orange">GEAR<br>REDUCTION</div><span class="arrow">➜</span><div class="node green">WHEELS</div>';break;case'test':case'stages':d=['SINGLE CYLINDER','MEASURE','5 CYLINDERS','CHASSIS'].map((s,j)=>'<div class="node '+(j>1?'orange':'')+'">'+s+'</div>'+(j<3?'<span class="arrow">→</span>':'')).join('');break;case'controls':d='<div class="node">RADIO<br>RECEIVER</div><span class="arrow">➜</span><div class="node orange">AIR VALVE<br>+ SHUTOFF</div><span class="arrow">➜</span><div class="node green">STOP<br>SAFELY</div>';break;case'report':d='<div class="node">QUESTION</div><span class="arrow">➜</span><div class="node orange">TEST +<br>MEASURE</div><span class="arrow">➜</span><div class="node green">RESULT +<br>NEXT STEP</div>';break;case'next':case'cad':d='<div class="node">SKETCH</div><span class="arrow">➜</span><div class="node orange">CAD</div><span class="arrow">➜</span><div class="node green">TEST</div>';break;case'gate':d='<div class="node">MEASURED<br>DATA</div><span class="arrow">➜</span><div class="node orange">MEET<br>TARGET?</div><span class="arrow">➜</span><div class="node green">ITERATE<br>OR PIVOT</div>';break;default:d='<div class="tank"></div><span class="arrow">➜</span><div class="node orange">AIR<br>EXPANDS</div><span class="arrow">➜</span><div class="fly"></div>'}$('diagram').innerHTML=d;document.querySelectorAll('#chapterlist button').forEach((b,j)=>b.classList.toggle('active',j===i));}
function current(){let t=a.currentTime||0;let i=C.findIndex((c,j)=>t>=c.start&&(j===C.length-1||t<C[j+1].start));return i<0?0:i}
C.forEach((c,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+c.title;b.onclick=()=>{a.currentTime=c.start;a.play()};$('chapterlist').appendChild(b)});
draw(0);a.addEventListener('timeupdate',()=>{let i=current();if(Number($('title').dataset.i)!==i){$('title').dataset.i=i;draw(i)}$('bar').style.width=((a.currentTime/a.duration)*100||0)+'%';$('time').textContent=fmt(a.currentTime)+' / '+fmt(a.duration)});
a.addEventListener('loadedmetadata',()=>{$('time').textContent='00:00 / '+fmt(a.duration)});
$('play').onclick=()=>{if(a.paused){a.play();$('play').textContent='❚❚ Pause'}else{a.pause();$('play').textContent='▶ Play'}};a.addEventListener('play',()=>$('play').textContent='❚❚ Pause');a.addEventListener('pause',()=>$('play').textContent='▶ Play');
$('back').onclick=()=>{let i=current();a.currentTime=C[Math.max(0,i-1)].start};$('next').onclick=()=>{let i=current();if(i<C.length-1)a.currentTime=C[i+1].start};
</script></body></html>
